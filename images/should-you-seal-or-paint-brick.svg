<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Diagram comparing untreated brickwork with a breathable coating and a film-forming coating that can trap moisture">
<style>text{font:16px sans-serif;fill:#333} .t{font:13px sans-serif;fill:#444} .h{font:18px sans-serif;fill:#333}</style>
<rect width="960" height="360" fill="#fbf7f2"/>
<g transform="translate(30,40)">
  <text class="h" x="0" y="0">Three states of a brick face</text>
  <g transform="translate(0,30)">
    <rect x="10" y="20" width="240" height="200" rx="6" fill="#b04a3a"/>
    <path d="M40 70h180 M40 110h180 M40 150h180" stroke="#9a3f32" stroke-width="6"/>
    <text class="t" x="20" y="250">Untreated clay brick</text>
    <text class="t" x="20" y="270">Dries through the face</text>
  </g>
  <g transform="translate(310,30)">
    <rect x="10" y="20" width="240" height="200" rx="6" fill="#b04a3a"/>
    <path d="M40 70h180 M40 110h180 M40 150h180" stroke="#9a3f32" stroke-width="6"/>
    <rect x="10" y="20" width="240" height="200" rx="6" fill="none" stroke="#7aa56b" stroke-width="6" stroke-dasharray="8 6"/>
    <path d="M130 200 v-90" stroke="#6fa8d6" stroke-width="3" fill="none" marker-end="none"/>
    <text class="t" x="118" y="96" fill="#1d4f7a">vapor</text>
    <text class="t" x="20" y="250">Breathable coating</text>
    <text class="t" x="20" y="270">Water vapor can still leave</text>
  </g>
  <g transform="translate(620,30)">
    <rect x="10" y="20" width="240" height="200" rx="6" fill="#b04a3a"/>
    <path d="M40 70h180 M40 110h180 M40 150h180" stroke="#9a3f32" stroke-width="6"/>
    <rect x="10" y="20" width="240" height="200" rx="6" fill="#c5d5e8" fill-opacity=".45" stroke="#4a6a8a" stroke-width="8"/>
    <circle cx="130" cy="120" r="14" fill="#6fa8d6" opacity=".85"/>
    <circle cx="160" cy="150" r="10" fill="#6fa8d6" opacity=".7"/>
    <text class="t" x="20" y="250">Film-forming coating</text>
    <text class="t" x="20" y="270">Moisture can be trapped</text>
  </g>
</g>
</svg>
