<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Diagram comparing severe outdoor brick exposure with a protected interior wall">
<style>text{font:15px sans-serif;fill:#333} .t{font:13px sans-serif;fill:#444}</style>
<rect width="960" height="280" fill="#fbf7f2"/>
<g transform="translate(50,30)">
  <rect x="0" y="20" width="380" height="160" fill="#d7e6f2" stroke="#9ab"/>
  <rect x="40" y="70" width="24" height="110" fill="#b5523b"/>
  <rect x="64" y="70" width="80" height="110" fill="#e8dcc8"/>
  <circle cx="300" cy="55" r="18" fill="#f4f7fb" stroke="#c5d0dc"/>
  <text x="190" y="200" text-anchor="middle">Severe outdoor exposure</text>
  <text class="t" x="190" y="218" text-anchor="middle">wet and freezing: Grade SW or F2</text>
</g>
<g transform="translate(500,30)">
  <rect x="0" y="20" width="380" height="160" fill="#eee6d8" stroke="#c4b49a"/>
  <rect x="80" y="50" width="220" height="110" fill="#f7f1e6" stroke="#d4c4b0"/>
  <rect x="80" y="50" width="16" height="110" fill="#c4a882"/>
  <text x="190" y="200" text-anchor="middle">Protected or interior</text>
  <text class="t" x="190" y="218" text-anchor="middle">Grade NW or NX only if kept dry</text>
</g>
<text x="20" y="265">Original diagram by Mortar Smash. Exposure still depends on the wall design and local climate, not this sketch alone.</text>
</svg>
