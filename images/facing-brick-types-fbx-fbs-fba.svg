<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Diagram of ASTM C216 facing brick appearance types: FBX tightest control, FBS standard production, FBA architectural criteria specified by the purchaser">
<style>text{font:16px sans-serif;fill:#333} .t{font:13px sans-serif;fill:#444} .h{font:18px sans-serif;fill:#333}</style>
<rect width="960" height="360" fill="#fbf7f2"/>
<g transform="translate(30,28)">
  <text class="h" x="0" y="10">ASTM C216 Type is about appearance control, not weather grade</text>
  <g transform="translate(0,40)">
    <rect x="0" y="0" width="280" height="250" rx="8" fill="#fff" stroke="#d4c4b0"/>
    <text x="16" y="36">Type FBX</text>
    <text class="t" x="16" y="64">Letter X: extreme or extra control</text>
    <rect x="20" y="86" width="72" height="36" fill="#b04a3a"/><rect x="100" y="86" width="72" height="36" fill="#b04a3a"/><rect x="180" y="86" width="72" height="36" fill="#b04a3a"/>
    <rect x="20" y="130" width="72" height="36" fill="#b04a3a"/><rect x="100" y="130" width="72" height="36" fill="#b04a3a"/><rect x="180" y="130" width="72" height="36" fill="#b04a3a"/>
    <text class="t" x="16" y="196">Most stringent Type in BIA 9A</text>
    <text class="t" x="16" y="218">Tightest size, distortion and chippage limits</text>
  </g>
  <g transform="translate(310,40)">
    <rect x="0" y="0" width="280" height="250" rx="8" fill="#fff" stroke="#d4c4b0"/>
    <text x="16" y="36">Type FBS</text>
    <text class="t" x="16" y="64">Letter S: standard production</text>
    <rect x="20" y="86" width="72" height="36" fill="#b04a3a"/><rect x="102" y="84" width="74" height="38" fill="#a34436"/><rect x="180" y="86" width="72" height="36" fill="#b45340"/>
    <rect x="18" y="130" width="74" height="36" fill="#a34436"/><rect x="100" y="132" width="72" height="36" fill="#b04a3a"/><rect x="182" y="128" width="74" height="38" fill="#c45a48"/>
    <text class="t" x="16" y="196">Usual facing brick Type</text>
    <text class="t" x="16" y="218">Wider permitted variation than FBX</text>
  </g>
  <g transform="translate(620,40)">
    <rect x="0" y="0" width="280" height="250" rx="8" fill="#fff" stroke="#d4c4b0"/>
    <text x="16" y="36">Type FBA</text>
    <text class="t" x="16" y="64">Letter A: architectural or aesthetic</text>
    <rect x="16" y="86" width="80" height="40" fill="#8a3a2a"/><rect x="108" y="80" width="70" height="44" fill="#c45a48"/><rect x="190" y="88" width="74" height="34" fill="#d9a090"/>
    <rect x="22" y="136" width="68" height="34" fill="#b04a3a"/><rect x="104" y="128" width="86" height="46" fill="#6b2d22"/><rect x="200" y="134" width="62" height="38" fill="#e8b4a0"/>
    <text class="t" x="16" y="196">Must be specified by the purchaser</text>
    <text class="t" x="16" y="218">Often less stringent than Type S</text>
  </g>
</g>
</svg>
